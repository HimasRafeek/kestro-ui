name: Bug report
description: Something doesn't work or looks wrong.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: e.g. ToolApproval
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short code sample, or a link to StackBlitz / CodeSandbox.
      render: tsx
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: kestro-ui 0.1.0 · React 19 · Tailwind 4.3 · Chrome 142
    validations:
      required: true
