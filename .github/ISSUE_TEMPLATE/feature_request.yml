name: Feature request
description: Suggest a component, prop or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you building?
      description: The agent interface you're working on and what's missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The component or API you have in mind. Sketches and links to similar UIs are welcome.
    validations:
      required: true
